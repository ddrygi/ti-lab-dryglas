<!DOCTYPE html>
<html lang="pl">

    <main>
        <section id="uslugi">
            <h2>Nasze usługi</h2>
<div class="cards">
    <article class="card">
        <h3>Przegląd</h3>
        <p>Hamulce i przerzutki.</p>
        <p class="card_price">od 120 zł</p>
    </article>
    <article class="card">
        <h3>Wymiana opony</h3>
        <p>Szybka wymiana dętki lub opony.</p>
        <p class="card_price">od 40 zł</p>
    </article>
    <article class="card card--highlight">
        <h3>Kompleksowy serwis</h3>
        <p>Pełne smarowanie, regulacja i czyszczenie.</p>
        <p class="card_price">od 250 zł</p>
        <p><strong>Najczęściej wybierane</strong></p>
    </article>
</div>
        </section>
